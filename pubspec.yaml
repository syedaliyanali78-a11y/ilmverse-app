name: ilmverse
description: "IlmVerse by Syed Aliyan - Production-ready AI learning hub and verified question solver powered by Google Gemini API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Official Google Gemini Generative AI SDK
  google_generative_ai: ^0.4.6

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Offline Storage for Bookmarks
  shared_preferences: ^2.2.3

  # Voice & Speech recognition input matrix
  #speech_to_text: ^6.6.0

  # Markdown & Rich Mathematical typesetting
  flutter_markdown: ^0.7.2+1

  # Typography & Vector Icons
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8

  # Text-to-speech for audible problem walk-throughs
  flutter_tts: ^4.0.2

  # Animations
  flutter_animate: ^4.5.0
  flutter_spinkit: ^5.2.1
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
